<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>كاتب عمومي — وثائقك الإدارية في دقيقة واحدة</title>
  <meta name="description" content="تطبيق ويب لتوليد الوثائق الإدارية المغربية (شكايات، توكيلات، عقود...) بصيغة Word وPDF." />
  <meta name="theme-color" content="#0f4c3a" />
  <meta name="color-scheme" content="light dark" />
  <meta name="google-adsense-account" content="ca-pub-3344053538816400">

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Amiri: headings (naskh) · IBM Plex Sans Arabic: text · Tajawal: the document preview, as exported -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Saved light/dark choice, applied before the first paint (js/theme.js). -->
  <script>
    try {
      var t = localStorage.getItem('katib-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {
      console.warn('Saved theme not restored (storage blocked), following the system', e);
    }
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div class="page-loading" style="min-height:100vh;"><div class="spinner dark"></div></div>
  </div>

  <!-- Third-party libraries used purely for client-side document export.
       Supabase is loaded as an ES module import inside js/supabaseClient.js. -->
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <!-- Generated automatically on deploy by .github/workflows/deploy-pages.yml.
       For local dev: copy supabase-config.example.js to supabase-config.js. -->
  <script src="supabase-config.js"></script>

  <script type="module" src="js/main.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3344053538816400"
     crossorigin="anonymous"></script>
</body>
</html>
