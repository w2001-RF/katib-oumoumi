  <meta name="theme-color" content="#0f4c3a" />
  <meta name="color-scheme" content="light dark" />
  <meta name="google-adsense-account" content="ca-pub-3344053538816400">
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://katiboumoumi.online/" />

  <!-- Social sharing cards (WhatsApp, Facebook, X...) -->
  <meta property="og:type" content="website" />

  <meta property="og:image" content="https://katiboumoumi.online/apple-touch-icon.png" />
  <meta name="twitter:card" content="summary" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "كاتب عمومي",
    "url": "https://katiboumoumi.online/",
    "inLanguage": "ar-MA",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "تطبيق ويب لتوليد الوثائق الإدارية المغربية (شكايات، توكيلات، عقود...) بصيغة Word وPDF.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "MAD" },
    "sameAs": ["https://t.me/KatibOumoumiBot"]
  }
  </script>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-48x48.png" type="image/png" sizes="48x48" />
  <link rel="icon" href="favicon-96x96.png" type="image/png" sizes="96x96" />
  <link rel="icon" href="favicon-192x192.png" type="image/png" sizes="192x192" />
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Self-hosted fonts (fonts/README.md): Amiri headings, IBM Plex Sans Arabic text,
       Tajawal for the document preview. Each stylesheet is pinned by an integrity
       hash, kept up to date by tools/sri.js (checked in CI by tests/web/sri_test.js). -->
  <link rel="stylesheet" href="fonts/fonts.css" integrity="sha384-ZuQNhV6z4bVzacDCpdLOmYjTLwVreYE7yb+GP+CQ52U+tf3vSltR3z4zv1mCZFPj" />

  <!-- Saved light/dark choice, applied before the first paint (js/theme.js). -->
  <script>
    try {
      var t = localStorage.getItem('katib-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {
      console.warn('Saved theme not restored (storage blocked), following the system', e);
    }
  </script>

  <link rel="stylesheet" href="css/styles.css" integrity="sha384-Dlkh5JCOL8XeB+TWy4tsobuhM/Wjm9alDso5tG70iWyzYzJaUgH3ON0g2gOLXZGi" />
</head>
<body>
  <div id="app">
    <div class="page-loading" style="min-height:100vh;"><div class="spinner dark"></div></div>
  </div>

  <!-- The Word/PDF export libraries are loaded only when a document is
       exported (js/utils/exportLibs.js). Supabase is loaded as an ES module
       import inside js/supabaseClient.js. -->

  <!-- Generated automatically on deploy by .github/workflows/deploy-pages.yml.
       For local dev: copy supabase-config.example.js to supabase-config.js. -->
  <script src="supabase-config.js"></script>

  <script type="module" src="js/main.js"></script>
  <!-- AdSense (Auto ads). No integrity attribute, on purpose (Sonar S5725 reviewed):
       Google serves this file unversioned and changes it continuously without
       publishing hashes, so an SRI hash would soon block every ad. Accepted risk:
       HTTPS from Google's own domain, whose content Google controls anyway.
       Note: unlike the rewarded ad (js/utils/ads.js), this tag loads Google's ad
       code on every visit. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3344053538816400"
     crossorigin="anonymous"></script>
</body>
</html>
