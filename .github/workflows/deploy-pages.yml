name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || {
            echo "SUPABASE_URL is not configured"
            exit 1
          }

          test -n "$SUPABASE_ANON_KEY" || {
            echo "SUPABASE_ANON_KEY is not configured"
            exit 1
          }

          URL_JSON=$(jq -Rn --arg value "$SUPABASE_URL" '$value')
          KEY_JSON=$(jq -Rn --arg value "$SUPABASE_ANON_KEY" '$value')

          cat > supabase-config.js <<EOF
          window.SUPABASE_CONFIG = {
            url: $URL_JSON,
            anonKey: $KEY_JSON
          };
          EOF

      # Google Ad Manager rewarded ads (docs/google-ads.md). Repository
      # *variables*, not secrets: they end up in the public page anyway.
      # Without GOOGLE_AD_UNIT_PATH the app shows no ads.
      - name: Generate ads configuration
        env:
          GOOGLE_AD_UNIT_PATH: ${{ vars.GOOGLE_AD_UNIT_PATH }}
          ADS_PERSONALIZED: ${{ vars.ADS_PERSONALIZED }}
          ADS_TXT: ${{ vars.ADS_TXT }}
        run: |
          if [ -n "$GOOGLE_AD_UNIT_PATH" ]; then
            UNIT_JSON=$(jq -Rn --arg value "$GOOGLE_AD_UNIT_PATH" '$value')
            NPA=true
            if [ "$ADS_PERSONALIZED" = "true" ]; then NPA=false; fi
            cat >> supabase-config.js <<EOF
          window.ADS_CONFIG = {
            provider: 'gpt-rewarded',
            adUnitPath: $UNIT_JSON,
            nonPersonalized: $NPA
          };
          EOF
          fi
          # ads.txt line(s) from Ad Manager / AdSense, e.g.
          # "google.com, pub-0000000000000000, DIRECT, f08c47fec0942fa0"
          if [ -n "$ADS_TXT" ]; then
            printf '%s\n' "$ADS_TXT" > ads.txt
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
