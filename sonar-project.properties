# SonarQube analysis — see docs/ai-agent.md § SonarQube.
# The token is NOT stored here: pass it with -Dsonar.token=... or the SONAR_TOKEN environment variable.

sonar.projectKey=katib-oumoumi
sonar.projectName=Katib Oumoumi
sonar.sourceEncoding=UTF-8

# Web app (vanilla JS), Edge Functions (Deno/TypeScript), model evaluation
sonar.sources=js,css,index.html,supabase/functions,eval
sonar.tests=supabase/functions
sonar.test.inclusions=**/*_test.ts
sonar.exclusions=**/*_test.ts,coverage/**,.scannerwork/**,supabase-config*.js

# Coverage from: deno test --coverage=coverage/raw ... && deno coverage coverage/raw --lcov --output=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
