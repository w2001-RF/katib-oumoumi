# SonarQube analysis — see docs/ai-agent.md § SonarQube.
# The token is NOT stored here: use the SONAR_TOKEN environment variable (or a git-ignored sonar.env).

sonar.projectKey=katib-oumoumi
sonar.projectName=Katib Oumoumi
sonar.sourceEncoding=UTF-8

# Web app (vanilla JS), Edge Functions (Deno/TypeScript), model evaluation
sonar.sources=js,css,index.html,supabase/functions,eval
sonar.tests=tests,supabase/functions
sonar.test.inclusions=tests/**,**/*_test.ts,**/*_test.js,supabase/functions/_shared/testing/**
sonar.exclusions=tests/**,**/*_test.ts,**/*_test.js,supabase/functions/_shared/testing/**,coverage/**,.scannerwork/**,supabase-config*.js,supabase/.temp/**

# Coverage from the Deno test run (see docs/ai-agent.md):
#   deno test --config tests/deno.json --allow-env --allow-read --coverage=coverage/raw tests supabase/functions
#   deno coverage coverage/raw --lcov --output=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Not counted in coverage (still analysed for bugs, smells and security):
# browser screens (js/admin/admin*.js; their logic, charts and HTML in js/admin/agent*.js and charts.js ARE covered) and DOM/canvas glue that need a real browser to run, the
# function's Deno.serve entry point, the model-evaluation CLI and the Telegram command-menu CLI
# (its logic, registerCommands/main, is tested in set_commands_test.ts). All the
# logic they call (api, router, storage, validators, templates, agent) is tested.
sonar.coverage.exclusions=js/main.js,js/ui.js,js/views/**,js/admin/admin*.js,js/utils/docGenerator.js,js/utils/searchableSelect.js,js/utils/shareButton.js,supabase/functions/telegram-webhook/index.ts,supabase/functions/agent-status/index.ts,supabase/functions/telegram-webhook/set_commands.ts,eval/**
